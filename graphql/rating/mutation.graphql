extend type Mutation {
    rateService(requestRating:JSON):responseRate @field (resolver: "RatingMutations@rateService")
}

type responseRate {
    message:String
    responses: [ratingResponse]

}

type ratingResponse {
    service:Service
    rating:Rating
    client:InternalClient
    technician:Technician
}

