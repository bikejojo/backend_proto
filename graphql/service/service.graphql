type Service {
    id:ID!
    id_state:ID! @rename(attribute: "stateId")
    id_requests:ID @rename(attribute: "requestsId")
    id_technician:ID! @rename(attribute: "techinicalId")
    id_client:ID! @rename(attribute: "clientId")
    typeClient:String!
    serviceDescription:String!
    programDate:String!
    requestsDate:String!

    state:[TypeState!]! @hasMany
    request:[Request!]! @hasMany
    service: Citation! @belongsTo
}
