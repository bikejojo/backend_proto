type AssociationTechnClient {
    id:ID!
    clientId:ID!
    technicalId:ID! @rename(attribute: "technicalId")
    dateTimeCreated:String!
    full_name:String
    phone_number:String
    updated_by_technician:String
    version:String
    status:String

    technicals: Technician @hasMany
    clients: [ExternalClient] @hasMany
}
