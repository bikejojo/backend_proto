extend type Mutation   {
    createSubcripcion(requestSubcription:JSON):responseSubcripcion @field(resolver: "SubcritionMutations@creaSubcription" )
    lowSubcription(requestSubcription:JSON):responseSubcripcion @field(resolver: "SubcritionMutations@lowSubcription" )
    registerPromotion(requestSubcription: JSON): responseSubcripcionPromotion @field(resolver: "SubcritionMutations@registerSubcriptPromot")
    registerTechnicianSubcription(requestSubcription:JSON): responseTechnicianSuscription @field(resolver: "SubcritionMutations@registerSubcriptionTechncian")
    validationSubscription(requestSubcription:JSON): responseTechnicianSuscription @field(resolver: "SubcritionMutations@technicalSubscription")
    expiredSuscription(requestSubcription:JSON):responseSuscripcion @field(resolver: "SubcritionMutations@disableExpirateSuscription")
}

type responseSubcripcion {
    message:String!
    messageNext:String
    subcription:Subcription
    technician:Technician
}

type responseSubcripcionPromotion {
    message:String!
    subcription:Subcription
    technician:Technician
    payment:Payment
    promotion:Promotion
}

type responseTechnicianSuscription{
    message:String
    result:Boolean
    technician:Technician
    suscripcion:suscripcions
}

type suscripcions {
    id:String
    name:String
    description:String
    codeSubcription:String
    starDateSubcription:String
    endDateSubcription:String
}

type responseSuscripcion {
    message:String
    count:String
}
