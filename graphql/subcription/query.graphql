extend type Query {
    getAllSubcription(requestSubcription:JSON):responseSuscriptions @field(resolver: "SubcriptionQuery@getAllTechnician")
    promotionValidity(requestPromotion:JSON):responseValidityPromotion @field (resolver: "SubcriptionQuery@validationDatePromotion")
    getDateExpiration:responsePromotion @field(resolver: "SubcriptionQuery@expirationPromotion")
    getPromotionFalse:responsePromotion @field(resolver: "SubcriptionQuery@falsePromotion")
    getPromotionValid:responsePromotion @field(resolver: "SubcriptionQuery@promotionValid")
    validationSuscriptionPromotion(requestSubcriptionPromotion:JSON):responseSuscription @field(resolver: "SubcriptionQuery@getSubcriptionPromotion")
    getAllHistorySuscription(requestSubcription:JSON): responseSuscription_ @field(resolver: "SubcriptionQuery@getSuscripcionHistorial")
}

type responseValidityPromotion{
    message:String
    promocion:Promotion
}

type responsePromotion {
    message:String
    promocion:[Promotion]
}

type responseSuscriptions {
    message:String
    result:Boolean
    technician:Technician
    suscripcion:Subcription
    promocion:Promotion
}

type responseSuscription {
    message:String
    suscripcion:[Subcription]
}

type responseSuscription_ {
    message:String
    suscripcion:[Subcription_]
}

type Subcription_ {
    name:String
    durationDescription:String
    codeSubcription:String
    starDateSubcription:String
    endDateSubcription:String
    status:String
}
