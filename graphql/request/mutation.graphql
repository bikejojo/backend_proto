extend type Mutation {
  registerRequest(requestRequest:JSON!):requestResponse @field(resolver: "SolicitudesMutations@create")
  acceptRequestTechnician(id:ID):requestResponseService @field(resolver: "SolicitudesMutations@acceptRequest")
  cancelRequestTechnician(id:ID):requestResponse @field(resolver: "SolicitudesMutations@cancelRequestTechnician")
  #cancelRequestClient(id:ID):requestResponse @field(resolver: "SolicitudesMutations@cancelRequestClient")
}

type requestResponse {
    message:String!
    requests:Request
    client:InternalClient
    technician:Technician

}

type requestResponseService{
    message:String
    requests:Request
    client:InternalClient
    technician:Technician
    messageService:String
    service:Service
}

