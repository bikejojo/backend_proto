extend type Mutation {

    sendPushNotification(message:String):Boolean @field(resolver: "DeviceTokenMutations@sendNotification")
    deviceUpdateToken(deviceId:String, token:String):deviceToken @field(resolver: "DeviceTokenMutations@updateDeviceTokens")
        registerDeviceToken(deviceTokenRequest:JSON):DeviceTokenResponse @field(resolver: "DeviceTokenMutations@register")
}

type DeviceTokenResponse {
    message:String
    token:String
    success:String
}

