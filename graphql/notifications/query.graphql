extend type Query {
    getNotificationsTechnician(Input:requestNotification):responseNotificationTech @field(resolver: "NotificationsQuery@getNotificationsTech" )
    getNotificationsClient(Input:requestNotificationClient):responseNotificationClient @field(resolver: "NotificationsQuery@getNotificationsClient" )
}

input requestNotificationClient {
    userClient:String
}

type responseNotificationClient {
    message:String
    client:InternalClient
    notification:[getnotify]
}

input requestNotification {
    userTech:String
}

type responseNotificationTech {
    message:String
    notificationSend:[getnotify]
    notificationGet:[getsnotify]
}

type getnotify {
    title:String
    body:String
    data:JSON
}

type getsnotify {
    title:String
    body:String
    data:JSON
}

