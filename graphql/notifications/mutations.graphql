extend type Mutation {
    sendNotifications( input:sendNotificationInput ): notificationsResponse @field(resolver: "NotificationMutations@send")
}

input sendNotificationInput {
    description:String
    type_device:String
    token_user:String
    receiver_userid:[ID]
    sender_userid:[ID]
    type_id:String
    title:String
    image: Upload
    data:JSON
}

type notificationsResponse {
    message:String
    success:Boolean
}
