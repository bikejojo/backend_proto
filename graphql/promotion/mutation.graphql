extend type Mutation {
    createPromotion(requestPromotion:JSON):responsePromotionn @field(resolver: "PromotionMutations@creaPromotion" )
    editPromotion(requestPromotion:JSON):responsePromotionn @field(resolver: "PromotionMutations@editPromotion" )
    unsubscribe(requestPromotion:JSON):responsePromotionn @field ( resolver: "PromotionMutations@lowPromotion")
}


type responsePromotionn {
    message: String
    success: Boolean
    promotion: Promotion
}

