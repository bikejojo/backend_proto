extend type Mutation {
    createTechnician(technicianRequest: JSON!, frontIdCard: Upload, backIdCard: Upload, photo: Upload): TechnicianResponse @field(resolver: "TecnicoMutations@create")
    updateTechnician(id: ID!, technicianRequest: JSON, frontIdCard: Upload, backIdCard: Upload): TechnicianResponse @field(resolver: "TecnicoMutations@update")
    deleteTecnico(id:ID! @whereKey): Response @field(resolver: "TecnicoMutations@delete")
    updatePhotoTechnician(id:ID!,photo:Upload):TechnicianResponse @field(resolver: "TecnicoMutations@photoUpdate")
    resetPasswordTechnician(id_technician:ID,new_password:String):responsePassTechnician @field(resolver: "TecnicoMutations@resetPasswordTechnicianAtSupport")
}

type responsePassTechnician{
    message:String
    result:Int
}

type Response {
  message: String
}

type TechnicianResponse {
  user: User
  technician: Technician
  skills: [technicianskills]
  message: String
  upcomingmessage: String
}

type technicianskills {
    id_skill:ID
    name:String
    experience:String
}


