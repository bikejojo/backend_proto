extend type Query {
    getAllTechnicians: [Technician] @all (model: "App\\Models\\Tecnico")
    getAllTechnicians_: getTechnicianTable @field(resolver: "TechnicianQuery@")
    getTechnicianById(id: ID! @whereKey): Technician @find (model: "App\\Models\\Tecnico")
    getFeaturedTechnicians(id_city:String) : responseListTechnician @field (resolver: "ServiceQuery@getAverageTechnical")
    getFeaturedFilterTechnicians(requestFilterTechnicial:JSON):responsesTechnician @field(resolver: "ServiceQuery@getAverageTechnicalFilter")
    getVerificationTechnician(id_city:String):responseVerification @field(resolver: "TechnicianQuery@verifactionCityTechnician")
}

type getTechnicianTable {
    message:String
    technicians:[techniciaData]
    status:Int
}

type techniciaData {
    id_technician:String
    full_name:String
    frontCard:String
    backCard:String
    photoCard:String
    email:String
    ci:String
    id_city:String
    name_city:String
    id_subcription_tech:String
    status_sub:String
    startDate:String
    endDate:String
    code_sub:String
}

type responseVerification{
    message:String,
    value:Int
}

type responseListTechnician {
    message:String
    status:Int
    technicianss:[_technicians]
}

type skillss {
    id_technician:ID
    id_skillss:ID
    name:String
    experience:String
}

type _technicians {
    technician:Technician
    skillss:[skillss]
}

type responsesTechnician {
    message:String
    status:Int
    technicians_:[techniciann]
}


type techniciann {
    id_technicians:ID
    firstName:String
    lastName:String
    phoneNumber:String
    photo:String
    average_rating:String
    skills_:[skils]
}

type skils {
    id_skills:ID
    name_skills:String
    experience:String
}
