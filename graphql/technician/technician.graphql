type Technician @model(class: "App\\Models\\Tecnico"){
  id: ID!
  firstName: String!
  lastName: String!
  frontIdCard: String
  backIdCard: String
  email: String
  phoneNumber: String!
  password: String!
  photo: String
  userId: String!
  cityId: String!

  city: City! @belongsTo
  user: User! @belongsTo

  technician: [TechnicianSkill!]! @hasMany
  associantions: [AssociationTechnClient!] @belongsTo
}

