type InternalClient @model(class: "App\\Models\\Cliente_Interno"){
  id: ID
  firstName: String! @trim
  lastName: String! @trim
  email: String @trim
  phoneNumber: String! @trim
  loginMethod: String! @trim
  photo: String
  userId:ID!
  cityId:ID!

  user: User! @belongsTo
  city: City! @belongsTo

}
