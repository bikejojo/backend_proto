extend type Mutation {
    createSkill(name: String , photo:Upload , groupId:String ): responseSkill @field(resolver: "HabilidadMutations@create")
    updateSkill(id: ID!, name: String! , photo:Upload): responseSkill @field(resolver: "HabilidadMutations@update")
}

type responseSkill {
    message:String
    skill:Skill
}
