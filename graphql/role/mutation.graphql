extend type Mutation {
    assignRoleToUser(userId: ID!, role: String!): responseRol @field(resolver: "RolMutations@assignRol")
    updateRoleToUser(rolRequest:JSON):responseRol @field(resolver: "RolMutations@updateRoles")
    #assignPermisseToUser(permiseRequest:JSON):responsePermisse @field(resolver: "RolMutations@assignPermise")
}

type responseRol {
    message: String
    rol: Role
    user: User
}


