type DetailAgendaTechnical {
    id:ID!
    id_agendaTechnical:ID @rename (attribute: "agendatechnicalId")
    id_client:ID @rename (attribute: "clientId")
    id_service:ID @rename (attribute: "serviceId")
    id_citation:ID @rename (attribute: "citationId")
    typeClient:String!
    typeJob:String!
    serviceDate:String!
    citationDate:String!
    createDate:String!

    details:Agenda_Technical @belongsTo
    citations:[Citation] @hasMany
    services:[Service] @hasMany
}

